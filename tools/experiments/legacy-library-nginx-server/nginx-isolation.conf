worker_processes 1;
worker_shutdown_timeout 120s;

error_log C:/NexusDeploy/logs/nginx/legacy-library-isolation-error.log info;
pid C:/NexusDeploy/run/legacy-library-isolation-nginx.pid;

events {
    worker_connections 256;
}

http {
    include C:/NexusDeploy/shared/nginx/nginx-1.31.6/conf/mime.types;
    default_type application/octet-stream;

    log_format migration '$time_iso8601 status=$status remote=$remote_addr '
                         'request="$request" bytes=$body_bytes_sent '
                         'upstream=$upstream_addr upstream_status=$upstream_status '
                         'request_time=$request_time upstream_time=$upstream_response_time';

    access_log C:/NexusDeploy/logs/nginx/legacy-library-isolation-access.log migration;

    sendfile on;
    keepalive_timeout 30s;
    server_tokens off;

    server {
        listen 127.0.0.1:18080;
        server_name localhost;

        root C:/NexusDeploy/candidates/legacy-library/V2026.10.21.1__nginx-relative-paths/dist;
        index index.html;

        # The legacy upload servlet accepts files up to 50 MiB.
        client_max_body_size 60m;

        # The primary production API path. Keep the complete /tsglxt URI.
        location /tsglxt/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Some existing Axios calls include /api even though baseURL already
        # ends in /tsglxt/api. Normalize the duplicated segment at the edge.
        location /tsglxt/api/api/ {
            proxy_pass http://127.0.0.1:8081/tsglxt/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # A few fetch/EventSource calls use a root-relative /api URL instead
        # of the configured Axios baseURL. Map those to the Tomcat context.
        location /api/ {
            proxy_pass http://127.0.0.1:8081/tsglxt/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # SSE must not be buffered and needs a longer idle read timeout.
        location = /tsglxt/api/message/sse {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location = /api/book/room/sse {
            proxy_pass http://127.0.0.1:8081/tsglxt/api/book/room/sse;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # Hash probes proved that Tomcat 8081 currently serves these exact
        # bytes, so the migration preserves that provider boundary.
        location /forum_images/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }

        location /chat_files/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }

        # Vue Router history fallback. More specific proxy locations above
        # take precedence and therefore cannot fall through to index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
