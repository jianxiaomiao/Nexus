worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 64;
}

http {
    log_format ip_observation 'listener=[$server_addr]:$server_port '
                              'connectionPeer=[$realip_remote_addr]:$realip_remote_port '
                              'effectiveIp=$remote_addr effectivePort="$remote_port" '
                              'route=$uri upstream=$upstream_addr status=$status';
    access_log logs/access.log ip_observation;

    # Outer proxy: the first trusted boundary, overwriting client-supplied IP claims.
    server {
        listen 127.0.0.1:18080;
        listen [::1]:18080;
        server_name localhost;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";

        location / {
            proxy_pass http://127.0.0.1:18082;
        }
    }

    # Inner proxy: two paths differ only in whether trusted realip restoration is enabled.
    server {
        listen 127.0.0.1:18082;
        server_name localhost;

        location = /raw {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_pass http://127.0.0.1:18081/peer;
        }

        location = /restored {
            # Loopback is used only to model an explicitly known preceding proxy here.
            # This cannot distinguish other local processes from that proxy.
            set_real_ip_from 127.0.0.1;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_pass http://127.0.0.1:18081/peer;
        }

        location / {
            return 404;
        }
    }
}
