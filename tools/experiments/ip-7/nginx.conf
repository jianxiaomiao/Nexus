worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 64;
}

http {
    # Make the boundary deterministic for this experiment. A single header
    # field must fit in one 8 KiB large buffer or Nginx returns 400.
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;

    log_format ip_observation escape=json
        'connectionPeer=[$realip_remote_addr]:$realip_remote_port '
        'effectiveIp=$remote_addr effectivePort="$remote_port" '
        'requestLength=$request_length request="$request" '
        'receivedXff="$http_x_forwarded_for" '
        'upstream=$upstream_addr status=$status';
    access_log logs/access.log ip_observation;

    server {
        listen 127.0.0.1:18080;
        listen [::1]:18080;
        server_name localhost;

        # 127.0.0.1 simulates the known proxy directly in front of this Nginx.
        # 198.51.100.20 simulates one additional trusted proxy in XFF.
        set_real_ip_from 127.0.0.1;
        set_real_ip_from 198.51.100.20;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location = /edge {
            # Java receives only Nginx's parsed effective address. The raw
            # diagnostic header is never forwarded as the trusted identity.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_pass http://127.0.0.1:18081/peer;
        }

        location / {
            return 404;
        }
    }
}
