server {
    listen 127.0.0.1:18080;
    server_name nexus.test;

    access_log /var/log/nginx/nexus-loopback-access.log nexus_loopback;
    error_log /var/log/nginx/nexus-loopback-error.log notice;

    return 308 https://nexus.test:18443$request_uri;
}

server {
    listen 127.0.0.1:18443 ssl;
    server_name nexus.test;

    root /opt/nexus/current/console/dist;
    index index.html;

    access_log /var/log/nginx/nexus-loopback-access.log nexus_loopback;
    error_log /var/log/nginx/nexus-loopback-error.log notice;

    ssl_certificate /etc/nginx/tls-lab/nexus.test.crt;
    ssl_certificate_key /etc/nginx/tls-lab/nexus.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NexusTlsLab:1m;
    ssl_session_timeout 10m;

    location ~ ^/(api|v1|s)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
