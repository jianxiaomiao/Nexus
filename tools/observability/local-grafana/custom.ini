app_mode = production
instance_name = nexus-local-grafana

[paths]
data = ${NEXUS_GRAFANA_STATE}
logs = ${NEXUS_GRAFANA_LOGS}
plugins = ${NEXUS_GRAFANA_PLUGINS}

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = 127.0.0.1
enforce_domain = true
root_url = http://127.0.0.1:3000/

[database]
type = sqlite3
path = ${NEXUS_GRAFANA_STATE}/grafana.db

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[plugins]
plugin_admin_enabled = false
public_key_retrieval_disabled = true
preinstall_disabled = true
preinstall_auto_update = false

[log]
mode = console file
level = info
