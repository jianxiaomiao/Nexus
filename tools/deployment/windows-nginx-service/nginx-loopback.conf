worker_processes 1;
worker_shutdown_timeout 120s;

error_log C:/NexusDeploy/logs/nginx/legacy-library-error.log info;
pid C:/NexusDeploy/run/nginx/nginx.pid;

events {
    worker_connections 256;
}

http {
    include C:/NexusDeploy/shared/nginx/nginx-1.31.6/conf/mime.types;
    default_type application/octet-stream;

    log_format migration '$time_iso8601 status=$status remote=$remote_addr '
                         'request="$request" bytes=$body_bytes_sent '
                         'upstream=$upstream_addr upstream_status=$upstream_status '
                         'request_time=$request_time upstream_time=$upstream_response_time';

    access_log C:/NexusDeploy/logs/nginx/legacy-library-access.log migration;

    client_body_temp_path C:/NexusDeploy/temp/nginx/client-body;
    proxy_temp_path C:/NexusDeploy/temp/nginx/proxy;
    fastcgi_temp_path C:/NexusDeploy/temp/nginx/fastcgi;
    uwsgi_temp_path C:/NexusDeploy/temp/nginx/uwsgi;
    scgi_temp_path C:/NexusDeploy/temp/nginx/scgi;

    sendfile on;
    keepalive_timeout 30s;
    server_tokens off;

    server {
        listen 127.0.0.1:18080;
        server_name localhost;

        root C:/NexusDeploy/candidates/legacy-library/V2026.10.21.1__nginx-relative-paths/dist;
        index index.html;

        # The legacy upload servlet accepts files up to 50 MiB.
        client_max_body_size 60m;

        # Keep the complete /tsglxt URI when forwarding the primary API path.
        location /tsglxt/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Normalize calls that duplicate /api after the configured base URL.
        location /tsglxt/api/api/ {
            proxy_pass http://127.0.0.1:8081/tsglxt/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Preserve the root-relative fetch/EventSource calls used by the UI.
        location /api/ {
            proxy_pass http://127.0.0.1:8081/tsglxt/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location = /tsglxt/api/message/sse {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location = /api/book/room/sse {
            proxy_pass http://127.0.0.1:8081/tsglxt/api/book/room/sse;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /forum_images/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }

        location /chat_files/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
