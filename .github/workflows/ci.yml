name: Nexus CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装环境
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: 安装依赖
        working-directory: ./nexus-console
        run: npm ci

      - name: 类型检查与生产构建
        working-directory: ./nexus-console
        run: npm run build
  electron:
    name: Electron 会话与 Renderer 构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: 安装控制台依赖
        working-directory: ./nexus-console
        run: npm ci

      # 本任务只运行 Node 测试和构建，不启动 Electron 或生成安装包。
      - name: 校验桌面依赖锁文件并安装工具依赖
        working-directory: ./nexus-desktop
        run: npm ci --ignore-scripts

      - name: 校验 Main 与 Preload 语法
        working-directory: ./nexus-desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check window-state.cjs

      - name: 运行 Electron Main 会话边界测试
        working-directory: ./nexus-desktop
        run: npm run test:auth-session

      - name: 运行 Renderer 会话状态测试
        working-directory: ./nexus-console
        run: >-
          node --test
          scripts/test-auth-session-initialization.mjs
          scripts/test-auth-session-login.mjs
          scripts/test-auth-session-invalidation.mjs
          scripts/test-auth-session-renewal.mjs
          scripts/test-request-gate.mjs
          scripts/test-network-deadline.mjs
          scripts/test-screenshot-submission.mjs

      - name: 桌面 Renderer 类型检查与生产构建
        working-directory: ./nexus-desktop
        run: npm run build:renderer

  mobile:
    name: 移动端会话与管理契约
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # 这些测试使用内存夹具，无需后端、MySQL、HBuilderX 或真机。
      # Android Keystore、原生交互和发行包仍由独立真机流程验收。
      - name: 运行移动端会话、传输与时间契约测试
        working-directory: ./nexus-mobile
        run: >-
          node --test
          scripts/test-auth-session.cjs
          scripts/test-management-contracts.cjs
          scripts/test-management-lifecycle.cjs

  backend:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/nexus_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: nexus_test_user
      SPRING_DATASOURCE_PASSWORD: "@nexusTestUserPassword!"
      NEXUS_AUTH_JWT_ISSUER: nexus_test_user
      NEXUS_AUTH_JWT_ACCESSTOKENTTL: 30m
      NEXUS_AUTH_JWT_SECRET: "XhrTJW2LdDmBpdGAa+W6lNjf8HJGDLkyCeComJHsvaw="
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: 2
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: 1
      NEXUS_WEBHOOK_SCHEDULING_ENABLED: 'false'
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: "@xiaoMiaoRootPassword!"
          MYSQL_DATABASE: nexus_test
          MYSQL_USER: nexus_test_user
          MYSQL_PASSWORD: "@nexusTestUserPassword!"
          TZ: UTC

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 配置java环境
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置Playwright
        working-directory: ./nexus-server
        run: >-
          sh ./mvnw -B exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: 配置 Chromium AppArmor
        shell: bash
        run: |
          browser="/home/runner/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell"
          test -x "$browser"

          sudo tee /etc/apparmor.d/nexus-ci-chromium > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile nexus-ci-chromium /home/runner/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          EOF

          sudo apparmor_parser -r /etc/apparmor.d/nexus-ci-chromium

      - name: 生成本次测试的 Webhook 密钥
        shell: bash
        run: |
          echo 'NEXUS_WEBHOOK_CRYPTO_CURRENT_KEY_VERSION=v1' >> "$GITHUB_ENV"
          echo "NEXUS_WEBHOOK_CRYPTO_KEYS_V1=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: 运行后端测试
        working-directory: ./nexus-server
        run: sh ./mvnw -B clean test

      - name: 验证真实 Redis 汇总缓存和 MySQL 工单租约
        working-directory: ./nexus-server
        env:
          NEXUS_TEST_REDIS_URI: redis://127.0.0.1:6379
          NEXUS_SUPPORT_LEASE_ACCEPTANCE: 'true'
        run: >-
          sh ./mvnw -B
          -Dtest=UsageSummaryRedisCacheIntegrationTests,SupportTicketLeaseIntegrationTest
          test

      - name: 验证默认时区不改变 UTC 业务时间
        working-directory: ./nexus-server
        env:
          JAVA_TOOL_OPTIONS: -Duser.timezone=America/Los_Angeles
        run: >-
          sh ./mvnw -B
          -Dtest=ApplicationServiceImplTests,ApplicationQuotaServiceTests,ApiKeyServiceTests,ApiKeyControllerTests,RegistrationClockTests,UsageClockTests,UtcPersistenceIntegrationTests
          test
