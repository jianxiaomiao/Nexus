worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 64;
}

http {
    log_format ip_observation escape=json
        'listener=[$server_addr]:$server_port '
        'connectionPeer=[$realip_remote_addr]:$realip_remote_port '
        'effectiveIp=$remote_addr effectivePort="$remote_port" '
        'route=$uri receivedXff="$http_x_forwarded_for" '
        'upstream=$upstream_addr status=$status';
    access_log logs/access.log ip_observation;

    server {
        listen 127.0.0.1:18080;
        listen [::1]:18080;
        server_name localhost;

        # Trust the actual IPv4 loopback peer and the rightmost simulated proxy.
        # Scanning the XFF chain from right to left stops at 192.0.2.10.
        location = /recursive-narrow {
            set_real_ip_from 127.0.0.1;
            set_real_ip_from 198.51.100.20;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_pass http://127.0.0.1:18081/peer;
        }

        # Expanding trust by one address lets traversal continue to 203.0.113.7.
        location = /recursive-expanded {
            set_real_ip_from 127.0.0.1;
            set_real_ip_from 198.51.100.20;
            set_real_ip_from 192.0.2.10;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_pass http://127.0.0.1:18081/peer;
        }

        # With recursion disabled, a trusted direct peer causes the last XFF value
        # to replace remote_addr; intermediate trust is not traversed.
        location = /non-recursive {
            set_real_ip_from 127.0.0.1;
            real_ip_header X-Forwarded-For;
            real_ip_recursive off;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_pass http://127.0.0.1:18081/peer;
        }

        # The trust list intentionally excludes ::1. An IPv6 direct peer cannot
        # make the supplied XFF replace its connection address.
        location = /untrusted-peer {
            set_real_ip_from 127.0.0.1;
            set_real_ip_from 198.51.100.20;
            set_real_ip_from 192.0.2.10;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_pass http://127.0.0.1:18081/peer;
        }

        location / {
            return 404;
        }
    }
}
