worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 64;
}

http {
    log_format ip_observation 'peer=[$remote_addr]:$remote_port '
                              'listener=[$server_addr]:$server_port '
                              'route=$uri upstream=$upstream_addr status=$status';
    access_log logs/access.log ip_observation;

    server {
        listen 127.0.0.1:18080;
        listen [::1]:18080;
        server_name localhost;

        location = /overwrite {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://127.0.0.1:18081/peer;
        }

        location = /append {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://127.0.0.1:18081/peer;
        }

        location / {
            return 404;
        }
    }
}
