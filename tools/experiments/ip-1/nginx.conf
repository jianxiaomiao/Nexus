worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 64;
}

http {
    log_format ip_observation 'peer=$remote_addr:$remote_port '
                              'listener=$server_addr:$server_port '
                              'upstream=$upstream_addr status=$status';
    access_log logs/access.log ip_observation;

    server {
        listen 127.0.0.1:18080;
        listen [::1]:18080;
        server_name localhost;

        location = /peer {
            # Experiment 1: do not generate IP forwarding headers.
            proxy_pass http://127.0.0.1:18081;
        }

        location / {
            return 404;
        }
    }
}
