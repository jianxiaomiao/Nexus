server {
    listen 127.0.0.1:18080;
    server_name localhost;

    root /opt/nexus/current/console/dist;
    index index.html;

    access_log /var/log/nginx/nexus-loopback-access.log nexus_loopback;
    error_log /var/log/nginx/nexus-loopback-error.log notice;

    # Management APIs, machine APIs, and public short-link redirects are the
    # only paths owned by the Java upstream. Overwrite client-supplied proxy
    # identity headers because this Nginx instance is the trusted first hop.
    location ~ ^/(api|v1|s)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vue Router history fallback. The Java locations above take precedence.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
