name: Nexus CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        
      - name: 安装环境
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: 安装依赖
        working-directory: ./nexus-console
        run: npm ci

      - name: 类型检查与生产构建
        working-directory: ./nexus-console
        run: npm run build
  backend:
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/nexus_test
      SPRING_DATASOURCE_USERNAME: nexus_test_user
      SPRING_DATASOURCE_PASSWORD: "@nexusTestUserPassword!"
      NEXUS_AUTH_JWT_ISSUER: nexus_test_user
      NEXUS_AUTH_JWT_ACCESSTOKENTTL: 30m
      NEXUS_AUTH_JWT_SECRET: "XhrTJW2LdDmBpdGAa+W6lNjf8HJGDLkyCeComJHsvaw="
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: 2
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: 1
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: "@xiaoMiaoRootPassword!"
          MYSQL_DATABASE: nexus_test
          MYSQL_USER: nexus_test_user
          MYSQL_PASSWORD: "@nexusTestUserPassword!"
          TZ: Asia/Shanghai

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 配置java环境
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置Playwright
        working-directory: ./nexus-server
        run: >-
          sh ./mvnw -B exec:java 
          -Dexec.mainClass=com.microsoft.playwright.CLI 
          -Dexec.args="install --with-deps chromium"

      - name: 配置 Chromium AppArmor
        shell: bash
        run: |
          browser="/home/runner/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell"
          test -x "$browser"

          sudo tee /etc/apparmor.d/nexus-ci-chromium > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile nexus-ci-chromium /home/runner/.cache/ms-playwright/chromium_headless_shell-1243/chrome-headless-shell-linux64/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          EOF

          sudo apparmor_parser -r /etc/apparmor.d/nexus-ci-chromium
          
      - name: 诊断 Chromium 运行环境
        shell: bash
        run: |
          echo "当前用户："
          id

          echo "AppArmor user namespace 限制："
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true

          echo "查找 Playwright headless-shell："
          browser="$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -print -quit)"
          if [ -z "$browser" ]; then
            echo "没有找到 chrome-headless-shell"
            exit 1
          fi

          echo "浏览器路径：$browser"
          ls -l "$browser"

          echo "检查动态库："
          ldd "$browser" | grep "not found" || echo "没有发现缺失的动态库"

          echo "尝试打开空白页面："
          if timeout 20s "$browser" --headless --dump-dom about:blank; then
            echo "浏览器直接启动成功"
          else
            result=$?
            echo "浏览器直接启动失败，退出码：$result"
          fi

      - name: 运行后端测试
        working-directory: ./nexus-server
        run: sh ./mvnw -B clean test
