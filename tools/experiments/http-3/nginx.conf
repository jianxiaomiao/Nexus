worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 256;
}

http {
    log_format http_experiment 'peer=$remote_addr:$remote_port '
                               'request="$request" status=$status '
                               'upstream=$upstream_addr upstreamStatus=$upstream_status '
                               'requestTime=$request_time upstreamTime=$upstream_response_time';
    access_log logs/access.log http_experiment;

    server {
        listen 127.0.0.1:18080;
        server_name localhost;

        location /v1/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            # The application may wait for one second before returning its own 429.
            proxy_read_timeout 3s;
            proxy_pass http://127.0.0.1:18081;
        }

        location / {
            return 404;
        }
    }
}
